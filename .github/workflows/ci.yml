# ========================================================
# GitHub Actions CI Pipeline — Enclave
# ========================================================
# Triggers on push/PR to main branch.
# Runs: lint, type check, backend tests, frontend builds.
# ========================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.13.15'
  NODE_VERSION: '22.23.2'
  PIP_VERSION: '26.2.1'

jobs:
  # ─── Backend: Lint + Type Check ───
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install pip==${{ env.PIP_VERSION }}
          pip install -r requirements.lock.txt
          pip install ruff==0.8.6 mypy==1.17.1

      - name: Ruff critical whole-repository lint
        run: ruff check app/ --select E9,F63,F7,F82 --output-format=github

      - name: Ruff full modular-baseline lint and format
        shell: bash
        run: |
          mapfile -t files < <(git diff --diff-filter=A --name-only fcef4229cd5ac1e1a937f3e6bf0406943cbd31d1 HEAD -- 'app/**/*.py')
          test "${#files[@]}" -gt 0
          ruff check "${files[@]}" --output-format=github
          ruff format "${files[@]}" --check

      - name: Mypy product-core boundary
        run: >-
          python -m mypy
          app/core/authorization.py
          app/platform/packs/contracts.py
          app/services/rollback_gate.py
          app/services/resilience_gate.py
          scripts/release_identity.py
          --ignore-missing-imports
          --follow-imports=skip
          --check-untyped-defs

  # ─── Backend: Tests ───
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enclave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enclave_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enclave_test
      RLS_ENFORCEMENT_ENABLED: "true"
      P2_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/enclave_p2_test
      P2_APP_DSN: postgresql://enclave_app_ci:p2_app_ci_pw@localhost:5432/enclave_p2_test
      P2_MAINTENANCE_DSN: postgresql://enclave_maintenance_ci:p2_maintenance_ci_pw@localhost:5432/enclave_p2_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: ci-test-secret-key-at-least-32-characters
      APP_ENV: test
      PACK_MKA_ENABLED: "true"
      MODULE_ROUTER_ENABLED: "true"
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3-flash-preview
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      LLAMAPARSE_API_KEY: ${{ secrets.LLAMAPARSE_API_KEY }}
      LLAMAPARSE_ENABLED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install pip==${{ env.PIP_VERSION }}
          pip install -r requirements.lock.txt -r requirements-test.lock.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Build isolated FORCE-RLS test database
        shell: bash
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE enclave_p2_test OWNER postgres"
          POSTGRES_DB=enclave_p2_test RLS_ENFORCEMENT_ENABLED=true alembic upgrade head

      - name: Provision production-like tenant database roles
        run: >-
          python scripts/provision_tenant_database_roles.py
          --admin-dsn "$P2_ADMIN_DSN"
          --application-role enclave_app_ci
          --application-password p2_app_ci_pw
          --maintenance-role enclave_maintenance_ci
          --maintenance-password p2_maintenance_ci_pw

      - name: Tenant RLS catalog and role gate
        run: >-
          python scripts/tenant_security_gate.py
          --dsn "$P2_ADMIN_DSN"
          --app-role enclave_app_ci
          --maintenance-role enclave_maintenance_ci
          --require-force
          --output artifacts/security/p2_tenant_security_report.json

      - name: Tenant session context static gate
        run: >-
          python scripts/tenant_session_context_gate.py
          --output artifacts/security/p2_tenant_session_context.json

      - name: Production-like cross-tenant attack matrix
        run: python -m pytest tests/test_p2_rls_hard_isolation.py -q
        env:
          P2_SHADOW_REPORT_OUTPUT: artifacts/security/p2_rls_shadow_report.json

      - name: Upload tenant isolation evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p2-tenant-security-evidence
          path: |
            artifacts/security/p2_tenant_security_report.json
            artifacts/security/p2_rls_shadow_report.json
            artifacts/security/p2_tenant_session_context.json
          retention-days: 30

      - name: Product architecture and tenant-isolation gates
        run: >-
          python -m pytest
          tests/test_tenant_isolation.py
          tests/test_tenant_security_gate.py
          tests/test_tenant_session_context_gate.py
          tests/test_p2_tenant_boundary_matrix.py
          tests/test_retrieval_facade_architecture.py
          tests/test_application_layer_boundaries.py
          tests/test_workflow_kernel_boundaries.py
          tests/test_deprecation_gates.py
          tests/test_phase_m_rollback.py
          tests/test_migration_compare.py
          tests/test_production_shadow_gate.py
          -q

      - name: P3 multimodal contract and safe-degradation gates
        run: |
          python scripts/run_multimodal_quality_gate.py \
            --mode mock_contract \
            --output artifacts/quality/p3_mock_contract.json
          python scripts/run_multimodal_quality_gate.py \
            --mode degraded \
            --provider enclave.disabled-provider \
            --output artifacts/quality/p3_degraded.json
          python scripts/build_multimodal_provider_matrix.py \
            artifacts/quality/p3_mock_contract.json \
            artifacts/quality/p3_degraded.json \
            --output artifacts/quality/p3_provider_matrix.json

      - name: Upload P3 multimodal quality evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p3-multimodal-quality-evidence
          path: artifacts/quality/*.json
          retention-days: 30

      - name: P4 resilience evidence contracts
        run: >-
          python -m pytest
          tests/test_p4_resilience_gate.py
          tests/test_p4_restore_drill.py
          tests/test_p4_alert_lifecycle.py
          tests/test_p4_runtime_readiness.py
          tests/test_p2_backup_ops.py
          tests/test_phase_m_rollback.py
          -q

      - name: Run tests
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --ignore=tests/benchmark_retrieval.py \
            -x

  # ─── Client Frontend: Lint + Build ───
  frontend-build:
    name: Client Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─── Playwright E2E Tests ───
  e2e-test:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [frontend-build]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download frontend build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Serve frontend & run E2E
        run: |
          npx serve -s dist -l 3001 &
          npx wait-on http://localhost:3001 --timeout 30000
          npx playwright test e2e/static-shell.spec.ts --reporter=github
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  # ─── Docker Build Verification ───
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build backend image
        run: docker build -t enclave-backend:ci .

      # ADR-010：掃描解析依賴必須存在於映像內，缺失即建置失敗（不得等文件 failed 才發現）
      - name: Assert scan-parse dependencies in image
        run: |
          docker run --rm enclave-backend:ci sh -c \
            "which pdftoppm && which pdfinfo && which tesseract && \
             python -c 'import pdf2image, pytesseract, PIL; print(\"scan deps ok\")'"

      - name: Build client frontend image
        run: docker build -t enclave-frontend:ci ./frontend

      - name: Build gateway image
        run: docker build -f docker/gateway.Dockerfile -t enclave-gateway:ci .

      - name: Prometheus alert fire and recover tests
        run: >-
          docker run --rm
          --entrypoint=/bin/promtool
          -v "$PWD/monitoring:/work:ro"
          prom/prometheus:v2.51.0@sha256:5ccad477d0057e62a7cd1981ffcc43785ac10c5a35522dc207466ff7e7ec845f
          test rules /work/alert_rules.test.yml

      - name: Scan backend image for Critical and High CVEs
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: enclave-backend:ci
          format: json
          output: artifacts/security/trivy-backend.json
          exit-code: '1'
          severity: CRITICAL,HIGH
          version: v0.74.0
          ignore-unfixed: true
          scanners: vuln
          trivyignores: .trivyignore.yaml

      - name: Scan frontend image for Critical and High CVEs
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: enclave-frontend:ci
          format: json
          output: artifacts/security/trivy-frontend.json
          exit-code: '1'
          severity: CRITICAL,HIGH
          version: v0.74.0
          ignore-unfixed: true
          scanners: vuln
          trivyignores: .trivyignore.yaml

      - name: Scan gateway image for Critical and High CVEs
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: enclave-gateway:ci
          format: json
          output: artifacts/security/trivy-gateway.json
          exit-code: '1'
          severity: CRITICAL,HIGH
          version: v0.74.0
          ignore-unfixed: true
          scanners: vuln
          trivyignores: .trivyignore.yaml

      - name: Upload container scan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: container-scan-evidence
          path: artifacts/security/trivy-*.json
          retention-days: 30

  # ─── Security: Dependency Audit ───
  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pip audit
        run: |
          python -m pip install pip==${{ env.PIP_VERSION }}
          pip install -r requirements.lock.txt
          pip install pip-audit==2.9.0 bandit==1.8.6
          pip-audit -r requirements.lock.txt --ignore-vuln PYSEC-2024-*
          pip-audit -r requirements-test.lock.txt

      - name: Bandit High severity gate
        run: python -m bandit -r app -lll -q

      - name: Supply-chain reproducibility and secret gate
        run: python scripts/supply_chain_gate.py

      - name: Dependency licence policy
        run: python scripts/license_policy_gate.py

      - name: Generate locked-source SBOM
        run: python scripts/generate_sbom.py

      - name: Upload security evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-evidence
          path: |
            artifacts/security
            artifacts/sbom
          retention-days: 30

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # DD-H08：frontend npm audit 必須計入閘門，不可 || true 假綠燈
      - name: NPM audit (frontend)
        working-directory: frontend
        run: npm ci --ignore-scripts && npm audit --audit-level=high
