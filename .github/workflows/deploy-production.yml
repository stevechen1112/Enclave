# ========================================================
# GitHub Actions CD — Deploy to Production
# ========================================================
# Triggers: manual dispatch only (with optional rollback)
# Requires: approval from environment protection rules
# ========================================================

name: Deploy Production

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to latest staging)'
        required: false
        default: 'staging'
        type: string
      rollback_tag:
        description: 'Rollback to specific tag (leave empty for normal deploy)'
        required: false
        default: ''
        type: string
      skip_backup:
        description: 'Skip database backup before deploy'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  # Keep this identical to the staging publisher; OCI repository names are lowercase.
  IMAGE_PREFIX: ghcr.io/stevechen1112/enclave

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false  # Never cancel production deploys

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Determine deploy tag
        id: tag
        run: |
          if [ -n "${{ inputs.rollback_tag }}" ]; then
            echo "tag=${{ inputs.rollback_tag }}" >> $GITHUB_OUTPUT
            echo "🔄 Rolling back to: ${{ inputs.rollback_tag }}"
          else
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "🚀 Deploying: ${{ inputs.image_tag }}"
          fi

      # ── Pre-deploy: Database Backup ──
      - name: Database backup
        if: ${{ !inputs.skip_backup }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd /opt/enclave
            export COMPOSE_ENV_FILES=.env.production,.env.db-admin,.env.maintenance
            set -a
            . ./.env.db-admin
            set +a
            echo "📦 Creating pre-deploy backup..."
            bash scripts/backup.sh --db-only
            echo "✅ Backup complete"

      # ── Deploy ──
      - name: Deploy to production
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd /opt/enclave
            TAG="${{ steps.tag.outputs.tag }}"
            export COMPOSE_ENV_FILES=.env.production,.env.db-admin,.env.maintenance

            echo "🏷️ Deploying tag: $TAG"

            # Save current image digests for rollback reference
            docker compose -f docker-compose.prod.yml images --format json > /tmp/pre-deploy-images.json 2>/dev/null || true

            # Pull specific tag
            docker pull ${{ env.IMAGE_PREFIX }}/backend:${TAG}
            docker pull ${{ env.IMAGE_PREFIX }}/frontend:${TAG}
            docker pull ${{ env.IMAGE_PREFIX }}/gateway:${TAG}

            # Tag as 'latest' for docker-compose
            docker tag ${{ env.IMAGE_PREFIX }}/backend:${TAG} ${{ env.IMAGE_PREFIX }}/backend:latest
            docker tag ${{ env.IMAGE_PREFIX }}/frontend:${TAG} ${{ env.IMAGE_PREFIX }}/frontend:latest
            docker tag ${{ env.IMAGE_PREFIX }}/gateway:${TAG} ${{ env.IMAGE_PREFIX }}/gateway:latest

            export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
            export IMAGE_TAG="$TAG"

            # The production host is not a git checkout. Keep its Compose
            # topology in lockstep with the immutable backend image so a new
            # worker/queue can never be omitted while application images move
            # forward. Validate before the atomic replacement and retain one
            # recoverable copy for operator rollback.
            MANIFEST_TMP="$(mktemp /opt/enclave/docker-compose.prod.yml.next.XXXXXX)"
            MANIFEST_CONTAINER="$(docker create ${IMAGE_PREFIX}/backend:${IMAGE_TAG})"
            cleanup_manifest() {
              [ -z "${MANIFEST_CONTAINER:-}" ] || docker rm -f "$MANIFEST_CONTAINER" >/dev/null 2>&1 || true
              [ -z "${MANIFEST_TMP:-}" ] || rm -f "$MANIFEST_TMP"
            }
            trap cleanup_manifest EXIT
            if docker cp "$MANIFEST_CONTAINER:/code/docker-compose.prod.yml" "$MANIFEST_TMP"; then
              docker rm "$MANIFEST_CONTAINER" >/dev/null
              MANIFEST_CONTAINER=""
              docker compose -f "$MANIFEST_TMP" config --quiet
              cp -a docker-compose.prod.yml docker-compose.prod.yml.previous
              mv "$MANIFEST_TMP" docker-compose.prod.yml
              MANIFEST_TMP=""
            elif [ -n "${{ inputs.rollback_tag }}" ]; then
              echo "⚠️ Legacy rollback image has no embedded Compose manifest; retaining current topology"
              docker rm "$MANIFEST_CONTAINER" >/dev/null
              MANIFEST_CONTAINER=""
              rm -f "$MANIFEST_TMP"
              MANIFEST_TMP=""
            else
              echo "❌ Release image is missing /code/docker-compose.prod.yml"
              exit 1
            fi
            trap - EXIT

            # Never terminate an in-flight long recording during deployment.
            # Require two consecutive idle samples covering active, reserved
            # and broker-queued Input work. If the queue cannot drain within
            # 30 minutes, fail closed and leave the current release running.
            INPUT_WORKER_ID="$(docker compose -f docker-compose.prod.yml ps -q worker-input 2>/dev/null || true)"
            if [ -n "$INPUT_WORKER_ID" ]; then
              INPUT_DRAINED=false
              INPUT_DRAIN_DEADLINE=$(( $(date +%s) + 1800 ))
              while [ "$(date +%s)" -lt "$INPUT_DRAIN_DEADLINE" ]; do
                if docker compose -f docker-compose.prod.yml exec -T worker-input python -c '
            import socket, sys
            import redis
            from app.celery_app import celery_app
            node = f"input@{socket.gethostname()}"
            inspector = celery_app.control.inspect(destination=[node], timeout=10)
            active = (inspector.active() or {}).get(node)
            reserved = (inspector.reserved() or {}).get(node)
            broker = redis.Redis.from_url(celery_app.conf.broker_url)
            queued = sum(broker.llen(name) for name in ("input.document", "input.media"))
            print(f"input_drain active={len(active or [])} reserved={len(reserved or [])} queued={queued}")
            sys.exit(0 if active is not None and reserved is not None and not active and not reserved and queued == 0 else 1)
            '; then
                  sleep 5
                  if docker compose -f docker-compose.prod.yml exec -T worker-input python -c '
            import socket, sys
            import redis
            from app.celery_app import celery_app
            node = f"input@{socket.gethostname()}"
            inspector = celery_app.control.inspect(destination=[node], timeout=10)
            active = (inspector.active() or {}).get(node)
            reserved = (inspector.reserved() or {}).get(node)
            broker = redis.Redis.from_url(celery_app.conf.broker_url)
            queued = sum(broker.llen(name) for name in ("input.document", "input.media"))
            sys.exit(0 if active is not None and reserved is not None and not active and not reserved and queued == 0 else 1)
            '; then
                    INPUT_DRAINED=true
                    echo "✅ Input queue drained before deployment"
                    break
                  fi
                fi
                sleep 15
              done
              if [ "$INPUT_DRAINED" != "true" ]; then
                echo "❌ Input work did not drain within 30 minutes; deployment aborted without terminating it"
                exit 1
              fi
            fi

            # 縮短舊程式與新 schema 重疊：先停 web/worker/beat，migrate，再起全栈
            docker compose -f docker-compose.prod.yml stop web worker worker-input worker-beat || true
            docker compose --profile operations -f docker-compose.prod.yml run --rm -T migrate
            docker compose --profile operations -f docker-compose.prod.yml run --rm -T provision-db-roles
            docker compose --profile operations -f docker-compose.prod.yml run --rm -T init-superuser
            docker compose --profile operations -f docker-compose.prod.yml run --rm -T init-demo
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans

            # A healthy API is insufficient when Input queues have no
            # consumer. Require the dedicated worker to exist and answer using
            # its own node name before declaring the deployment successful.
            test -n "$(docker compose -f docker-compose.prod.yml ps -q worker-input)"
            for i in $(seq 1 6); do
              if docker compose -f docker-compose.prod.yml exec -T worker-input sh -lc \
                '/opt/venv/bin/celery -A app.celery_app inspect ping --destination="input@$(hostname)" --timeout 10 2>/dev/null | grep -q OK'; then
                echo "✅ Input worker check passed on attempt $i"
                break
              fi
              if [ $i -eq 6 ]; then
                echo "❌ Dedicated Input worker unavailable after 60s"
                exit 1
              fi
              sleep 10
            done

            # Health：必須經 edge 對外路徑通過（容器內 8000 僅作除錯，不可單獨判定成功）
            for i in $(seq 1 6); do
              sleep 10
              if curl -sf http://localhost/health; then
                echo ""
                echo "✅ Health check passed on attempt $i"
                break
              fi
              echo "edge /health failed; container probe (diagnostic only):"
              docker compose -f docker-compose.prod.yml exec -T web curl -sf http://localhost:8000/health || true
              if [ $i -eq 6 ]; then
                echo "❌ Health check failed after 60s (edge unreachable)"
                exit 1
              fi
              echo "⏳ Waiting for health check... ($i/6)"
            done

            # Clean up
            docker image prune -f

            echo "✅ Production deployment complete: $TAG"

      # ── Post-deploy Smoke Test ──
      - name: Smoke test
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd /opt/enclave
            export COMPOSE_ENV_FILES=.env.production,.env.db-admin,.env.maintenance
            echo "🔍 Running smoke tests..."

            # API health：必須經 edge；容器內 8000 僅診斷，不可單獨判定成功
            if curl -sf http://localhost/health | grep -q '"status":"ok"'; then
              echo "  ✅ API health OK (edge)"
            else
              echo "  ❌ edge /health failed; container probe (diagnostic only):"
              docker compose -f docker-compose.prod.yml exec -T web curl -sf http://localhost:8000/health || true
              exit 1
            fi

            # Frontend loads
            # Follow the local HTTP→HTTPS redirect through the edge. TLS is
            # verified separately on the public hostname; localhost cannot
            # match the public certificate name.
            curl -fsSkL -o /dev/null -w "%{http_code}" http://localhost/ | grep -q "200"
            echo "  ✅ Frontend OK"

            # Emergency rollback may target an image created before release metadata existed.
            # New deployments must always pass strict backend/frontend/schema parity.
            if [ -n "${{ inputs.rollback_tag }}" ]; then
              echo "  ⚠️ Explicit rollback: legacy release metadata may be unavailable"
            else
              curl -sf http://localhost/health > /tmp/enclave-health.json
              curl -fsSkL http://localhost/release.json > /tmp/enclave-frontend-release.json
              docker compose -f docker-compose.prod.yml exec -T web alembic current > /tmp/enclave-alembic-current.txt
              python3 - <<'PY'
            import json
            import re
            from pathlib import Path
            health = json.loads(Path('/tmp/enclave-health.json').read_text())
            frontend = json.loads(Path('/tmp/enclave-frontend-release.json').read_text())
            current_text = Path('/tmp/enclave-alembic-current.txt').read_text()
            backend = health.get('release') or {}
            keys = ('release_id', 'source_commit', 'source_dirty', 'schema_head', 'route_contract_hash')
            mismatches = [key for key in keys if backend.get(key) != frontend.get(key)]
            required = {'/overview', '/ask', '/knowledge/assets', '/knowledge/new', '/knowledge/review', '/knowledge/quality', '/system/health', '/job'}
            missing = sorted(required - set(frontend.get('canonical_routes') or []))
            actual_heads = sorted(re.findall(r'^([A-Za-z0-9_]+)(?:\s+\(head\))?$', current_text, re.MULTILINE))
            schema_mismatch = actual_heads != [backend.get('schema_head')]
            dirty_source = backend.get('source_dirty') != 'false'
            if not backend.get('identifiable') or dirty_source or mismatches or missing or schema_mismatch:
                raise SystemExit(f'release parity HOLD: identifiable={backend.get("identifiable")} mismatches={mismatches} missing={missing} actual_heads={actual_heads}')
            print(f'release parity PASS: {backend.get("release_id")} {backend.get("source_commit")}')
            PY
            fi

            echo "✅ All smoke tests passed"

      - name: Set up Node.js for authenticated browser smoke
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser smoke dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Authenticated canonical-route smoke
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://kachu.tw' }}
          E2E_USER: ${{ vars.PRODUCTION_E2E_USER }}
          E2E_PASS: ${{ secrets.PRODUCTION_E2E_PASS }}
          RELEASE_PARITY_E2E: 'true'
        run: npx playwright test e2e/release-parity.spec.ts --reporter=github

      # ── Summary ──
      - name: Deployment summary
        run: |
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Rollback:** ${{ inputs.rollback_tag || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backup:** ${{ inputs.skip_backup && 'Skipped' || 'Created' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
