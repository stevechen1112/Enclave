# ========================================================
# GitHub Actions CD — Deploy to Staging
# ========================================================
# Triggers: on push to main (after CI passes)
# Deploys: auto-deploy to staging server via SSH
# ========================================================

name: Deploy Staging

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # OCI repository names must be lowercase. GitHub preserves the mixed-case
  # repository display name (Enclave), which Docker rejects as an image path.
  IMAGE_PREFIX: ghcr.io/stevechen1112/enclave

jobs:
  deploy-staging:
    name: Build release images / deploy staging when configured
    runs-on: ubuntu-latest
    # Only deploy if CI passed (rely on branch protection rules)
    environment: staging
    env:
      STAGING_CONFIGURED: ${{ secrets.STAGING_HOST != '' && secrets.STAGING_USER != '' && secrets.STAGING_SSH_KEY != '' }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release identity
        id: release
        shell: bash
        run: python scripts/release_identity.py --github-output >> "$GITHUB_OUTPUT"

      # ── Build & Push Docker Images ──
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:staging
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENCLAVE_RELEASE_ID=${{ steps.release.outputs.release_id }}
            ENCLAVE_SOURCE_COMMIT=${{ steps.release.outputs.source_commit }}
            ENCLAVE_SOURCE_DIRTY=${{ steps.release.outputs.source_dirty }}
            ENCLAVE_BUILD_TIME=${{ steps.release.outputs.build_time }}
            ENCLAVE_DEPLOYMENT_MANIFEST_ID=${{ steps.release.outputs.deployment_manifest_id }}
            ENCLAVE_SCHEMA_HEAD=${{ steps.release.outputs.schema_head }}
            ENCLAVE_ROUTE_CONTRACT_HASH=${{ steps.release.outputs.route_contract_hash }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:staging
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_RELEASE_ID=${{ steps.release.outputs.release_id }}
            VITE_SOURCE_COMMIT=${{ steps.release.outputs.source_commit }}
            VITE_SOURCE_DIRTY=${{ steps.release.outputs.source_dirty }}
            VITE_BUILD_TIME=${{ steps.release.outputs.build_time }}
            VITE_DEPLOYMENT_MANIFEST_ID=${{ steps.release.outputs.deployment_manifest_id }}
            VITE_SCHEMA_HEAD=${{ steps.release.outputs.schema_head }}

      # ── Deploy via SSH ──
      - name: Deploy to staging server
        if: env.STAGING_CONFIGURED == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/enclave

            export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
            export IMAGE_TAG="${{ github.sha }}"

            docker pull ${IMAGE_PREFIX}/backend:${IMAGE_TAG}
            docker pull ${IMAGE_PREFIX}/frontend:${IMAGE_TAG}
            docker tag ${IMAGE_PREFIX}/backend:${IMAGE_TAG} ${IMAGE_PREFIX}/backend:latest
            docker tag ${IMAGE_PREFIX}/frontend:${IMAGE_TAG} ${IMAGE_PREFIX}/frontend:latest

            # 縮短舊程式與新 schema 重疊：先停 app 層，migrate，再起全栈
            docker compose -f docker-compose.prod.yml stop web worker worker-beat || true
            docker compose -f docker-compose.prod.yml run --rm -T web alembic upgrade head
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans

            # Health：必須經 edge 對外路徑（容器內 8000 僅診斷）
            for i in $(seq 1 6); do
              sleep 10
              if curl -sf http://localhost/health; then
                echo "✅ Staging health check passed on attempt $i"
                break
              fi
              echo "edge /health failed; container probe (diagnostic only):"
              docker compose -f docker-compose.prod.yml exec -T web curl -sf http://localhost:8000/health || true
              if [ $i -eq 6 ]; then
                echo "❌ Staging health check failed after 60s (edge unreachable)"
                exit 1
              fi
            done

            curl -sf http://localhost/health > /tmp/enclave-health.json
            curl -sf http://localhost/release.json > /tmp/enclave-frontend-release.json
            docker compose -f docker-compose.prod.yml exec -T web alembic current > /tmp/enclave-alembic-current.txt
            python3 - <<'PY'
            import json
            import re
            from pathlib import Path
            health = json.loads(Path('/tmp/enclave-health.json').read_text())
            frontend = json.loads(Path('/tmp/enclave-frontend-release.json').read_text())
            current_text = Path('/tmp/enclave-alembic-current.txt').read_text()
            backend = health.get('release') or {}
            keys = ('release_id', 'source_commit', 'source_dirty', 'schema_head', 'route_contract_hash')
            mismatches = [key for key in keys if backend.get(key) != frontend.get(key)]
            required = {'/overview', '/ask', '/knowledge/assets', '/knowledge/new', '/knowledge/review', '/knowledge/quality', '/system/health', '/job'}
            missing = sorted(required - set(frontend.get('canonical_routes') or []))
            actual_heads = sorted(re.findall(r'^([A-Za-z0-9_]+)(?:\s+\(head\))?$', current_text, re.MULTILINE))
            schema_mismatch = actual_heads != [backend.get('schema_head')]
            dirty_source = backend.get('source_dirty') != 'false'
            if not backend.get('identifiable') or dirty_source or mismatches or missing or schema_mismatch:
                raise SystemExit(f'release parity HOLD: identifiable={backend.get("identifiable")} mismatches={mismatches} missing={missing} actual_heads={actual_heads}')
            print(f'release parity PASS: {backend.get("release_id")} {backend.get("source_commit")}')
            PY

            docker image prune -f
            echo "✅ Staging deployment complete: ${{ github.sha }}"

      - name: Record unavailable staging activation
        if: env.STAGING_CONFIGURED != 'true'
        run: |
          echo "::warning::Release images were published, but STAGING_HOST/STAGING_USER/STAGING_SSH_KEY are not configured."
          echo "staging_activation=UNAVAILABLE" >> "$GITHUB_STEP_SUMMARY"

      # ── Notify ──
      - name: Deployment summary
        run: |
          echo "## 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Images:** \`staging\` tag pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- **Staging activation:** ${{ env.STAGING_CONFIGURED == 'true' && 'deployed and parity-checked' || 'unavailable (secrets not configured)' }}" >> $GITHUB_STEP_SUMMARY
