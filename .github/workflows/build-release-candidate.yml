# Build immutable release images from an explicitly reviewed repository commit.
# This does not deploy. Production activation remains in deploy-production.yml.
name: Build Release Candidate

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to package
        required: true
        type: string

env:
  IMAGE_PREFIX: ghcr.io/stevechen1112/enclave
  SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  build:
    name: Build immutable images and provenance
    runs-on: ubuntu-latest
    concurrency:
      group: build-release-${{ inputs.source_sha }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact clean tagged source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git tag --points-at HEAD | grep -Eq '^(release-|rc-|v[0-9])'

      - name: Resolve release identity
        id: release
        shell: bash
        env:
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
          ENCLAVE_RELEASE_ID: rc-${{ github.run_id }}-${{ github.run_attempt }}
        run: python scripts/release_identity.py --github-output >> "$GITHUB_OUTPUT"

      - name: Pre-build release source gate
        shell: bash
        run: |
          python scripts/freeze_deployment_manifest.py
          python scripts/release_source_gate.py \
            --manifest artifacts/knowledge/deployment_manifest.json \
            --output artifacts/knowledge/release_source_gate_prebuild_last_run.json \
            --allow-missing-images

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENCLAVE_RELEASE_ID=${{ steps.release.outputs.release_id }}
            ENCLAVE_SOURCE_COMMIT=${{ steps.release.outputs.source_commit }}
            ENCLAVE_SOURCE_DIRTY=${{ steps.release.outputs.source_dirty }}
            ENCLAVE_BUILD_TIME=${{ steps.release.outputs.build_time }}
            ENCLAVE_DEPLOYMENT_MANIFEST_ID=${{ steps.release.outputs.deployment_manifest_id }}
            ENCLAVE_SCHEMA_HEAD=${{ steps.release.outputs.schema_head }}
            ENCLAVE_ROUTE_CONTRACT_HASH=${{ steps.release.outputs.route_contract_hash }}

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_RELEASE_ID=${{ steps.release.outputs.release_id }}
            VITE_SOURCE_COMMIT=${{ steps.release.outputs.source_commit }}
            VITE_SOURCE_DIRTY=${{ steps.release.outputs.source_dirty }}
            VITE_BUILD_TIME=${{ steps.release.outputs.build_time }}
            VITE_DEPLOYMENT_MANIFEST_ID=${{ steps.release.outputs.deployment_manifest_id }}
            VITE_SCHEMA_HEAD=${{ steps.release.outputs.schema_head }}

      - name: Build and push gateway
        id: gateway
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/gateway.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/gateway:${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENCLAVE_RELEASE_ID=${{ steps.release.outputs.release_id }}
            ENCLAVE_SOURCE_COMMIT=${{ steps.release.outputs.source_commit }}
            ENCLAVE_BUILD_TIME=${{ steps.release.outputs.build_time }}

      - name: Generate SBOM and bind image digests
        env:
          ENCLAVE_RELEASE_ID: ${{ steps.release.outputs.release_id }}
          ENCLAVE_SOURCE_COMMIT: ${{ env.SOURCE_SHA }}
          BACKEND_IMAGE_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE_DIGEST: ${{ steps.frontend.outputs.digest }}
          GATEWAY_IMAGE_DIGEST: ${{ steps.gateway.outputs.digest }}
        run: |
          python scripts/generate_sbom.py
          python scripts/freeze_deployment_manifest.py \
            --backend-image-digest "$BACKEND_IMAGE_DIGEST" \
            --frontend-image-digest "$FRONTEND_IMAGE_DIGEST" \
            --gateway-image-digest "$GATEWAY_IMAGE_DIGEST"
          python scripts/release_source_gate.py \
            --manifest artifacts/knowledge/deployment_manifest.json \
            --output artifacts/knowledge/release_source_gate_last_run.json

      - name: Upload release provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: enclave-release-provenance-${{ env.SOURCE_SHA }}
          path: |
            artifacts/sbom
            artifacts/knowledge/deployment_manifest.json
            artifacts/knowledge/release_source_gate*.json
          retention-days: 90
