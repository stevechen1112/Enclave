version: '3.8'

services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
    ports:
      - "8011:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RAGFLOW_BASE_URL=http://host.docker.internal:9380
      - RAGFLOW_ENABLED=${RAGFLOW_ENABLED:-true}
      - RAGFLOW_API_KEY=${RAGFLOW_API_KEY:-}
      - RAGFLOW_DATASET_ID=${RAGFLOW_DATASET_ID:-}
      - RAGFLOW_FORCE_PARSE=${RAGFLOW_FORCE_PARSE:-false}
      - CLOUD_OCR_PROVIDER=${CLOUD_OCR_PROVIDER:-}
      - CLOUD_OCR_MODEL=${CLOUD_OCR_MODEL:-}
      - CLOUD_OCR_TRIGGER_MIN_CHARS=${CLOUD_OCR_TRIGGER_MIN_CHARS:-200}
      - SCAN_PARSE_STRICT=${SCAN_PARSE_STRICT:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - WEKNORA_BASE_URL=http://host.docker.internal:8081
      - PIPESHUB_BASE_URL=http://host.docker.internal:8012
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_EMBED_URL=http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=enclave
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5435:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6380:6379"
  
  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 --queues=celery,input.media,input.document
    volumes:
      - .:/code
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RAGFLOW_BASE_URL=http://host.docker.internal:9380
      - RAGFLOW_ENABLED=${RAGFLOW_ENABLED:-true}
      - RAGFLOW_API_KEY=${RAGFLOW_API_KEY:-}
      - RAGFLOW_DATASET_ID=${RAGFLOW_DATASET_ID:-}
      - RAGFLOW_FORCE_PARSE=${RAGFLOW_FORCE_PARSE:-false}
      - CLOUD_OCR_PROVIDER=${CLOUD_OCR_PROVIDER:-}
      - CLOUD_OCR_MODEL=${CLOUD_OCR_MODEL:-}
      - CLOUD_OCR_TRIGGER_MIN_CHARS=${CLOUD_OCR_TRIGGER_MIN_CHARS:-200}
      - SCAN_PARSE_STRICT=${SCAN_PARSE_STRICT:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - WEKNORA_BASE_URL=http://host.docker.internal:8081
      - PIPESHUB_BASE_URL=http://host.docker.internal:8012
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_EMBED_URL=http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
