# ========================================================
# Docker Compose — Production Configuration (On-Premise)
# ========================================================
# Prerequisites:
#   1. Copy .env.production.example, .env.db-admin.example, and
#      .env.maintenance.example to their non-example names (mode 0600)
#   2. Fill in ALL values (especially SECRET_KEY, distinct DB passwords, API keys)
#   3. Core: docker compose -f docker-compose.prod.yml up -d
#   4. With sidecars (pack=true): also merge compose/sidecars.yml + pack-enabled.env
#      docker compose --env-file .env.production --env-file compose/image-pins.env \
#        --env-file compose/pack-enabled.env \
#        -f docker-compose.prod.yml -f compose/sidecars.yml --profile standard up -d
#      See compose/README.md (DD-M10 / DD-M11).
# ========================================================

services:
  # ── Backend API ──
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/enclave}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    # NO --reload, NO volume mount — production uses baked-in image
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 2
        --timeout-keep-alive 120
        --log-level warning
        --access-log
    restart: always
    env_file: ${APP_ENV_FILE:-.env.production}
    expose:
      - "8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ADMIN_IP_WHITELIST_ENABLED=true
      - RATE_LIMIT_ENABLED=true
      - RAGFLOW_ENABLED=${RAGFLOW_ENABLED:-false}
      - PIPESHUB_ENABLED=${PIPESHUB_ENABLED:-false}
      - WEKNORA_ENABLED=${WEKNORA_ENABLED:-false}
      - RAGFLOW_BASE_URL=${RAGFLOW_BASE_URL:-http://ragflow:9380}
      - PIPESHUB_BASE_URL=${PIPESHUB_BASE_URL:-http://pipeshub-api:3000}
      - WEKNORA_BASE_URL=${WEKNORA_BASE_URL:-http://weknora:8080}
      - RAGFLOW_API_KEY=${RAGFLOW_API_KEY:-}
      - PIPESHUB_API_KEY=${PIPESHUB_API_KEY:-}
      - WEKNORA_API_KEY=${WEKNORA_API_KEY:-}
      - RAGFLOW_DATASET_ID=${RAGFLOW_DATASET_ID:-}
      - OLLAMA_EMBED_URL=${OLLAMA_EMBED_URL:-http://ollama-embed:11434}
    volumes:
      - uploads_data:/code/uploads    # Persist uploaded files only
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Database (pgvector) ──
  db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
      - ./configs/postgresql-tuning.conf:/etc/postgresql/conf.d/tuning.conf:ro
      - ./backups:/backups
    environment:
      - POSTGRES_USER=${DB_ADMIN_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}
      - POSTGRES_DB=${DB_ADMIN_DATABASE:-enclave}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-postgres} -d ${DB_ADMIN_DATABASE:-enclave}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # No external port exposure in production

  # ── One-shot schema owner operations (never used by web/worker) ──
  migrate:
    profiles: ["operations"]
    image: ${IMAGE_PREFIX:-ghcr.io/enclave}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file:
      - ${APP_ENV_FILE:-.env.production}
      - ${DB_ADMIN_ENV_FILE:-.env.db-admin}
    environment:
      - APP_ENV=${APP_ENV:-production}
      - POSTGRES_SERVER=${DB_ADMIN_HOST:-db}
      - POSTGRES_PORT=${DB_ADMIN_PORT:-5432}
      - POSTGRES_DB=${DB_ADMIN_DATABASE:-enclave}
      - POSTGRES_USER=${DB_ADMIN_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy

  provision-db-roles:
    profiles: ["operations"]
    image: ${IMAGE_PREFIX:-ghcr.io/enclave}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: python scripts/provision_tenant_database_roles.py
    env_file:
      - ${APP_ENV_FILE:-.env.production}
      - ${DB_ADMIN_ENV_FILE:-.env.db-admin}
      - ${MAINTENANCE_ENV_FILE:-.env.maintenance}
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_ADMIN_HOST=${DB_ADMIN_HOST:-db}
      - DB_ADMIN_PORT=${DB_ADMIN_PORT:-5432}
      - DB_ADMIN_DATABASE=${DB_ADMIN_DATABASE:-enclave}
      - DB_ADMIN_USER=${DB_ADMIN_USER:-postgres}
      - DB_ADMIN_PASSWORD=${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy

  # ── One-shot initial organization owner (idempotent; schema owner only) ──
  init-superuser:
    profiles: ["operations"]
    image: ${IMAGE_PREFIX:-ghcr.io/enclave}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: python scripts/init_superuser.py
    env_file:
      - ${APP_ENV_FILE:-.env.production}
      - ${DB_ADMIN_ENV_FILE:-.env.db-admin}
    environment:
      - APP_ENV=${APP_ENV:-production}
      - POSTGRES_SERVER=${DB_ADMIN_HOST:-db}
      - POSTGRES_PORT=${DB_ADMIN_PORT:-5432}
      - POSTGRES_DB=${DB_ADMIN_DATABASE:-enclave}
      - POSTGRES_USER=${DB_ADMIN_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy

  # ── Redis ──
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: always
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No external port exposure in production

  # ── Celery Worker ──
  worker:
    image: ${IMAGE_PREFIX:-ghcr.io/enclave}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A app.celery_app worker
        --loglevel=info
        --concurrency=2
        --max-tasks-per-child=200
    restart: always
    env_file:
      - ${APP_ENV_FILE:-.env.production}
      - ${MAINTENANCE_ENV_FILE:-.env.maintenance}
    environment:
      - APP_ENV=${APP_ENV:-production}
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RAGFLOW_ENABLED=${RAGFLOW_ENABLED:-false}
      - PIPESHUB_ENABLED=${PIPESHUB_ENABLED:-false}
      - WEKNORA_ENABLED=${WEKNORA_ENABLED:-false}
      - RAGFLOW_BASE_URL=${RAGFLOW_BASE_URL:-http://ragflow:9380}
      - PIPESHUB_BASE_URL=${PIPESHUB_BASE_URL:-http://pipeshub-api:3000}
      - WEKNORA_BASE_URL=${WEKNORA_BASE_URL:-http://weknora:8080}
      - RAGFLOW_API_KEY=${RAGFLOW_API_KEY:-}
      - PIPESHUB_API_KEY=${PIPESHUB_API_KEY:-}
      - WEKNORA_API_KEY=${WEKNORA_API_KEY:-}
      - RAGFLOW_DATASET_ID=${RAGFLOW_DATASET_ID:-}
      - OLLAMA_EMBED_URL=${OLLAMA_EMBED_URL:-http://ollama-embed:11434}
    volumes:
      - uploads_data:/code/uploads    # Shared with web for file processing
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Celery worker has no HTTP server — use celery inspect ping（失敗必須非 0）
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --timeout 10 2>/dev/null | grep -q OK"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Celery Beat（outbox / reconciliation 排程；缺少則投影永不收斂）──
  worker-beat:
    image: ${IMAGE_PREFIX:-ghcr.io/enclave}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat --loglevel=info
    restart: always
    # beat 不開 HTTP port，停用映像內建的 curl /health 檢查（否則永遠 unhealthy）
    healthcheck:
      disable: true
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      - APP_ENV=${APP_ENV:-production}
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RAGFLOW_ENABLED=${RAGFLOW_ENABLED:-false}
      - PIPESHUB_ENABLED=${PIPESHUB_ENABLED:-false}
      - WEKNORA_ENABLED=${WEKNORA_ENABLED:-false}
    volumes:
      - uploads_data:/code/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Ollama Embedding（CPU；EMBEDDING_PROVIDER=ollama 時啟用）──
  # 啟用方式：docker compose ... --profile embed up -d
  # 首次啟動後需拉模型：docker compose ... exec ollama-embed ollama pull bge-m3
  ollama-embed:
    image: ollama/ollama:0.9.0@sha256:2ea3b768a8f2dcd4d910f838d79702bb952089414dd578146619c0a939647ac6
    profiles: ["embed"]
    restart: always
    environment:
      # 常駐模型：預設 keep_alive 5 分鐘會卸載，bge-m3 冷載入約 2 分鐘，
      # 每次冷載都會讓檢索逾時 → 設 -1 永不卸載（約佔 1.5GB RAM）
      - OLLAMA_KEEP_ALIVE=-1
    expose:
      - "11434"
    volumes:
      - ollama_embed_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Client Frontend ──
  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/enclave}/frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M


  # ── Nginx Gateway ──
  gateway:
    # First-party gateway image applies OS security fixes and is scanned with the release.
    image: ${IMAGE_PREFIX:-ghcr.io/enclave}/gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    restart: always
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      # SSL 上線後於 .env.production 設 GATEWAY_CONF=gateway-ssl.conf
      - ./nginx/${GATEWAY_CONF:-gateway.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      # /health 在 HTTP/HTTPS 兩種設定下都可用（/ 在 SSL 模式會 301）
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Prometheus (T4-11) ──
  prometheus:
    image: prom/prometheus:v2.51.0@sha256:5ccad477d0057e62a7cd1981ffcc43785ac10c5a35522dc207466ff7e7ec845f
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    expose:
      - "9090"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ── Grafana (T4-11) ──
  grafana:
    image: grafana/grafana:10.4.0@sha256:f9811e4e687ffecf1a43adb9b64096c50bc0d7a782f8608530f478b6542de7d5
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    expose:
      - "3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  prometheus_data:
  grafana_data:
  ollama_embed_data:
