# CONTAMINATED — DO NOT USE. See REVIEW.md and intent_questions_draft_v2.yaml
# Blind Z3 — 意圖題草稿（無 GT）
# 規則：本檔只含題幹與意圖；禁止依 extract／系統回答填答案。
# 標註完成後另存 z3_blind_questions.yaml 並設 frozen: true。
# 出題依據：客戶資料夾名 + 檔名 + 文件類型 + 角色情境。

meta:
  design: artifacts/blind_z3/DESIGN.md
  anti_target_drawing: true
  frozen: false
  note: >
    寫題時不得打開 extracts/。標註階段才打開原檔填 expected_spans。
    若標註發現「文件無法回答」，改題型為 refuse，不得改成好抽的欄位題。

# ---------------------------------------------------------------------------
# 格式：
# - id
# - type: A|B|C|D|E  （單檔｜無檔名｜多跳｜拒答｜易混淆）
# - role: owner|finance|legal|pm|cross
# - intent: 一句話業務意圖
# - question: 實際問句（給系統）
# - evidence_hint: 僅供標註員找原檔（評測時不餵給系統）
# - answer_shape: amount|date|party|clause|compare|refuse|list|other
# - expected_spans: []   # 標註前必須空
# - must_refuse: null    # 標註時填
# ---------------------------------------------------------------------------

