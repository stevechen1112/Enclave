# CG-CLAMAV：ClamAV sidecar（SaaS／託管 compose overlay）
# 用法：docker compose -f docker-compose.yml -f compose/clamav.yml up -d

services:
  clamav:
    image: clamav/clamav:stable
    profiles: ["saas", "staging", "production"]
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - enclave-net
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  web:
    profiles: ["saas", "staging", "production"]
    environment:
      - CLAMAV_ENABLED=true
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - CLAMAV_FAIL_CLOSED=true
    depends_on:
      clamav:
        condition: service_healthy

volumes:
  clamav_data:
