# Eval Profile: Z3 Blind (GT Frozen)
# 對應 testdata/golden/z3_blind_questions.yaml
# 用於 scripts/eval_answer_correctness.py --questions z3_blind_questions.yaml
name: z3_blind
version: "1.0"
description: "Z3 盲測 hold-out — dual-root 八策+客戶，GT frozen 2026-08-05"

# ── 題庫 ──
questions_file: z3_blind_questions.yaml
questions_offset: 0
# questions_limit: null  # null = 全跑

# ── 語料 ──
corpus_manifest: blind_z3/corpus_manifest.json

# ── 檢索 ──
retrieval_top_k: 5
retrieval_mode: hybrid
rerank: true

# ── 指標與門檻 ──
metrics:
  - hit_at_k
  - mrr
  - answer_correctness
thresholds:
  hit_at_k_min: 0.85
  mrr_min: 0.70
  answer_correctness_min: 0.90

# ── Judge ──
judge_type: deterministic
llm_judge_model: ""  # 不用 LLM judge
llm_judge_mode: review

# ── Artifact ──
artifact_name: answer_correctness_z3

# ── Hold-out 特徵 ──
gt_frozen: true
gt_frozen_at: "2026-08-05"
intent_frozen: true
anti_target_drawing: true